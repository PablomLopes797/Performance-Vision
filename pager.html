<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes" />
  <title>Painel do Motorista · Warehouse Vision</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f7fb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 16px;
      margin: 0;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e4ebf3;
      border-radius: 28px;
      box-shadow: 0 18px 55px #10254112;
      max-width: 480px;
      width: 100%;
      padding: 28px 20px 32px;
      text-align: center;
      transition: box-shadow 0.2s;
    }

    .logo {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #2877ff;
      font-weight: 800;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #071426;
      letter-spacing: -0.03em;
      margin-bottom: 2px;
    }

    .sub {
      font-size: 14px;
      color: #71849b;
      margin-bottom: 24px;
    }

    /* Campo de senha */
    .campo-senha {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .campo-senha input {
      height: 56px;
      border: 1px solid #dfe7ef;
      border-radius: 16px;
      padding: 0 18px;
      font-size: 18px;
      background: #fbfdff;
      color: #15283f;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
      -webkit-appearance: none;
    }

    .campo-senha input:focus {
      border-color: #75a6ff;
      box-shadow: 0 0 0 4px #347eff12;
    }

    .campo-senha button {
      height: 56px;
      padding: 0 24px;
      background: linear-gradient(135deg, #2d7bff, #16bda9);
      border: none;
      border-radius: 16px;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 8px 22px #347eff35;
      transition: transform 0.15s, opacity 0.15s;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    .campo-senha button:active {
      transform: scale(0.97);
    }

    .campo-senha button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Área de status */
    .status-area {
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: #f8fafc;
      border: 1px solid #e4ebf3;
      padding: 24px 16px;
      transition: background 0.3s, border-color 0.3s;
    }

    .status-area .mensagem {
      font-size: 16px;
      color: #526982;
      line-height: 1.6;
      width: 100%;
    }

    .status-area .horario {
      font-size: 14px;
      color: #71849b;
      margin-top: 8px;
    }

    .status-area .destaque {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0.02em;
      margin: 4px 0 8px;
    }

    .status-area .destaque.acionado {
      color: #1db889;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .status-area .destaque.aguardando {
      color: #efa83a;
    }

    .status-area .destaque.erro {
      color: #e34b60;
    }

    .status-area .frase-acionamento {
      font-size: 18px;
      font-weight: 600;
      color: #1db889;
      background: #effcf5;
      padding: 10px 18px;
      border-radius: 40px;
      margin-top: 8px;
      line-height: 1.4;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }

    .badge-refresh {
      margin-top: 18px;
      font-size: 11px;
      color: #8c9aab;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge-refresh .led {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #8c9aab;
    }

    .badge-refresh .led.ativo {
      background: #1fc4b1;
      animation: pisca 1.2s steps(2) infinite;
    }

    @keyframes pisca {
      0% { opacity: 1; }
      50% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .hidden {
      display: none !important;
    }

    /* Ajustes para telas muito pequenas */
    @media (max-width: 420px) {
      .card {
        padding: 20px 14px 24px;
      }
      h1 {
        font-size: 24px;
      }
      .sub {
        font-size: 13px;
      }
      .campo-senha input {
        height: 50px;
        font-size: 16px;
      }
      .campo-senha button {
        height: 50px;
        font-size: 16px;
      }
      .status-area .destaque {
        font-size: 28px;
      }
      .status-area .frase-acionamento {
        font-size: 16px;
        padding: 8px 14px;
      }
    }

    @media (max-width: 360px) {
      .status-area {
        min-height: 140px;
        padding: 16px 10px;
      }
      .status-area .destaque {
        font-size: 24px;
      }
      .status-area .frase-acionamento {
        font-size: 14px;
      }
    }

    /* Suporte para landscape em celular – mantém legível */
    @media (max-height: 600px) and (orientation: landscape) {
      .card {
        padding: 16px 20px;
      }
      .status-area {
        min-height: 120px;
        padding: 16px;
      }
      .campo-senha {
        flex-direction: row;
        gap: 10px;
      }
      .campo-senha input {
        flex: 2;
      }
      .campo-senha button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Warehouse Vision</div>
    <h1>Painel do Motorista</h1>
    <p class="sub">Informe sua senha para verificar o acionamento</p>

    <div class="campo-senha">
      <input type="text" id="inputSenha" placeholder="Digite sua senha" autocomplete="off" inputmode="text" />
      <button id="btnConsultar">Consultar</button>
    </div>

    <div class="status-area" id="statusArea">
      <div class="mensagem" id="mensagemStatus">Aguardando consulta...</div>
      <div class="horario" id="horarioStatus"></div>
    </div>

    <div class="badge-refresh">
      <span class="led" id="ledRefresh"></span>
      <span id="textoRefresh">Atualização automática a cada 60s</span>
    </div>
  </div>

  <!-- ===== ÁUDIO EXTERNO ===== -->
  <!-- Substitua o src pelo link do seu arquivo de som (pode ser no GitHub raw) -->
  <audio id="somAlerta" preload="auto" crossorigin="anonymous">
    <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
    <!-- Fallback: se o MP3 não carregar, tenta OGG (opcional) -->
    <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.ogg" type="audio/ogg">
    Seu navegador não suporta áudio.
  </audio>

  <script>
    (function() {
      'use strict';

      // ===== CONFIGURAÇÃO SUPABASE =====
      const SUPABASE_URL = 'https://jgtisruauiajjfoesvol.supabase.co';
      const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpndGlzcnVhdWlhampmb2Vzdm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1OTY3NjYsImV4cCI6MjEwMzE3Mjc2Nn0.yiAsD6c06UEauyAUCFYs0KQnuWBVfLAeP_oYE8yGOwQ';
      const AGENDA_TABLE = encodeURIComponent('AGENDA');

      // ===== ELEMENTOS =====
      const inputSenha = document.getElementById('inputSenha');
      const btnConsultar = document.getElementById('btnConsultar');
      const mensagemStatus = document.getElementById('mensagemStatus');
      const horarioStatus = document.getElementById('horarioStatus');
      const statusArea = document.getElementById('statusArea');
      const ledRefresh = document.getElementById('ledRefresh');
      const textoRefresh = document.getElementById('textoRefresh');
      const somAlerta = document.getElementById('somAlerta');

      // ===== ESTADO =====
      let senhaAtual = '';
      let ultimoStatus = 'vazio'; // 'vazio', 'aguardando', 'acionado', 'erro'
      let intervaloId = null;
      let audioPronto = false;

      // ===== INICIALIZAÇÃO DO ÁUDIO (requer interação do usuário) =====
      function prepararAudio() {
        if (audioPronto) return;
        // Tenta carregar o áudio para que fique pronto
        somAlerta.load();
        // Em alguns navegadores, é necessário tocar e pausar para "ativar"
        somAlerta.play().then(() => {
          somAlerta.pause();
          somAlerta.currentTime = 0;
          audioPronto = true;
          console.log('Áudio preparado.');
        }).catch(() => {
          // Se falhar, mantém audioPronto false, mas tentaremos novamente no clique
          console.warn('Áudio não pôde ser preparado automaticamente.');
        });
      }

      // ===== FUNÇÃO PARA TOCAR O SOM =====
      function tocarAlerta() {
        // Se o áudio ainda não foi preparado, tenta novamente
        if (!audioPronto) {
          prepararAudio();
          // Se mesmo assim não estiver pronto, tenta reproduzir diretamente
        }

        // Tenta reproduzir o áudio
        somAlerta.currentTime = 0;
        const playPromise = somAlerta.play();

        if (playPromise !== undefined) {
          playPromise.catch((error) => {
            console.warn('Falha ao tocar áudio:', error);
            // Fallback: tenta usar Web Audio API como último recurso
            try {
              const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'sine';
              osc.frequency.value = 880;
              gain.gain.value = 0.2;
              gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start();
              osc.stop(audioCtx.currentTime + 0.15);
              // Toca três vezes com pequena pausa
              setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.value = 880;
                gain2.gain.value = 0.2;
                gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start();
                osc2.stop(audioCtx.currentTime + 0.15);
              }, 250);
              setTimeout(() => {
                const osc3 = audioCtx.createOscillator();
                const gain3 = audioCtx.createGain();
                osc3.type = 'sine';
                osc3.frequency.value = 880;
                gain3.gain.value = 0.2;
                gain3.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc3.connect(gain3);
                gain3.connect(audioCtx.destination);
                osc3.start();
                osc3.stop(audioCtx.currentTime + 0.15);
              }, 500);
            } catch (e) {
              console.warn('Fallback de áudio também falhou:', e);
            }
          });
        }
      }

      // ===== CONSULTA AO SUPABASE =====
      async function consultarSenha(senha) {
        if (!senha || senha.trim() === '') {
          atualizarStatus('vazio', 'Digite uma senha para consultar.', '');
          return;
        }

        const senhaLimpa = senha.trim();
        btnConsultar.disabled = true;
        ledRefresh.className = 'led ativo';
        textoRefresh.textContent = 'Consultando...';

        try {
          const url = `${SUPABASE_URL}/rest/v1/${AGENDA_TABLE}?SENHA=eq.${encodeURIComponent(senhaLimpa)}&select=SENHA,"ACIONAMENTO ENTRADA"`;
          const resp = await fetch(url, {
            headers: {
              'apikey': SUPABASE_ANON,
              'Authorization': `Bearer ${SUPABASE_ANON}`
            }
          });

          if (!resp.ok) throw new Error('Erro na consulta: ' + resp.status);

          const data = await resp.json();

          if (!data || data.length === 0) {
            atualizarStatus('erro', 'Senha não encontrada.', '');
            return;
          }

          const registro = data[0];
          const acionamento = registro['ACIONAMENTO ENTRADA'] || null;

          if (acionamento && acionamento.trim() !== '') {
            const horario = acionamento.trim();
            atualizarStatus('acionado', horario);
          } else {
            atualizarStatus('aguardando', '');
          }

        } catch (err) {
          console.error(err);
          atualizarStatus('erro', 'Erro ao consultar: ' + err.message, '');
        } finally {
          btnConsultar.disabled = false;
          ledRefresh.className = 'led';
          textoRefresh.textContent = 'Atualização automática a cada 60s';
        }
      }

      // ===== ATUALIZAR INTERFACE =====
      function atualizarStatus(novoStatus, param1, param2) {
        const statusAnterior = ultimoStatus;
        ultimoStatus = novoStatus;

        statusArea.className = 'status-area';

        if (novoStatus === 'vazio') {
          mensagemStatus.textContent = param1 || 'Aguardando consulta...';
          horarioStatus.textContent = '';
          statusArea.style.background = '#f8fafc';
          statusArea.style.borderColor = '#e4ebf3';
        } else if (novoStatus === 'aguardando') {
          mensagemStatus.innerHTML = `
            <div class="destaque aguardando">⏳ AGUARDANDO</div>
            <div style="font-size:15px; color:#71849b;">A senha está cadastrada, mas ainda não foi acionada.</div>
          `;
          horarioStatus.textContent = 'Última verificação: ' + new Date().toLocaleTimeString();
          statusArea.style.background = '#fff9eb';
          statusArea.style.borderColor = '#efa83a';
        } else if (novoStatus === 'acionado') {
          const horario = param1 || 'Horário não informado';
          mensagemStatus.innerHTML = `
            <div class="destaque acionado">✅ ACIONADO</div>
            <div class="frase-acionamento">A senha informada foi Acionada. Por gentileza se dirigir à portaria.</div>
          `;
          horarioStatus.textContent = 'Acionamento registrado em: ' + horario;
          statusArea.style.background = '#effcf5';
          statusArea.style.borderColor = '#1db889';

          // Dispara o som se mudou para acionado (evita repetir a cada refresh)
          if (statusAnterior !== 'acionado' && statusAnterior !== 'vazio') {
            tocarAlerta();
          }
        } else if (novoStatus === 'erro') {
          mensagemStatus.innerHTML = `
            <div class="destaque erro">⚠️ ERRO</div>
            <div style="font-size:15px; color:#71849b;">${param1 || 'Falha na consulta'}</div>
          `;
          horarioStatus.textContent = '';
          statusArea.style.background = '#fff1f2';
          statusArea.style.borderColor = '#e34b60';
        }
      }

      // ===== AÇÃO DE CONSULTAR =====
      function realizarConsulta() {
        const senha = inputSenha.value.trim();
        if (senha) {
          senhaAtual = senha;
          consultarSenha(senha);
          // Inicia auto-refresh se ainda não iniciado
          if (!intervaloId) {
            iniciarAutoRefresh();
          }
        } else {
          atualizarStatus('vazio', 'Digite uma senha para consultar.', '');
        }
      }

      // ===== AUTO-REFRESH (a cada 60 segundos) =====
      function iniciarAutoRefresh() {
        if (intervaloId) clearInterval(intervaloId);
        intervaloId = setInterval(() => {
          if (senhaAtual && senhaAtual.trim() !== '') {
            consultarSenha(senhaAtual);
          }
        }, 60000);
      }

      // ===== EVENTOS =====
      btnConsultar.addEventListener('click', function(e) {
        // Prepara o áudio na interação do usuário
        prepararAudio();
        realizarConsulta();
      });

      inputSenha.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          btnConsultar.click();
        }
      });

      // Se o usuário esvaziar o campo, para o refresh e reseta
      inputSenha.addEventListener('input', function() {
        if (this.value.trim() === '') {
          if (intervaloId) {
            clearInterval(intervaloId);
            intervaloId = null;
          }
          senhaAtual = '';
          atualizarStatus('vazio', 'Aguardando consulta...', '');
        }
      });

      // ===== INICIALIZAÇÃO =====
      atualizarStatus('vazio', 'Digite sua senha e clique em Consultar', '');
      console.log('Painel do Motorista pronto.');

      // Pré-carregar áudio se possível
      somAlerta.load();

    })();
  </script>
</body>
</html>
