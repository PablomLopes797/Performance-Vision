/* ===== FUNÇÃO DE INICIALIZAÇÃO DA SIDEBAR ===== */
function initSidebar() {
  // Marcar item ativo com base na URL
  const currentPage = location.pathname.split('/').pop();
  if (!currentPage) currentPage = 'index.html';

  // Ativar link correspondente
  document.querySelectorAll('.nav-item').forEach(link => {
    const href = link.getAttribute('href');
    if (href === currentPage) {
      link.classList.add('active');
    }
  });

  // Configurar navegação interna (apenas no index)
  document.querySelectorAll('.nav-item[data-page]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const page = btn.dataset.page;
      go(page);
      // Atualizar ativo
      document.querySelectorAll('.nav-item').forEach(l => l.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  // Botão de logout
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.addEventListener('click', logoutWms);

  // Usuários
  const usersNav = document.getElementById('usersNav');
  if (usersNav) usersNav.addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = 'user.html';
  });

  // Submenus já funcionam com <details>
}

/* ===== CARREGAMENTO DA SIDEBAR ===== */
document.addEventListener('DOMContentLoaded', () => {
  fetch('sidebar.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('sidebar-container').innerHTML = html;
      initSidebar(); // Chamar depois de injetar
    })
    .catch(err => console.error('Erro ao carregar sidebar:', err));

  // Restante da inicialização (renderBases, login, etc.)
  // ...
});
</script>
